# dogleash (ThinkPad P50): single internal eDP-1 display, Intel iGPU only.
# Adapted from chunix's nwg-displays multi-monitor config (HDMI-A-1/DP-1/DP-2)
# for a laptop with no external output currently attached. "preferred" lets
# Hyprland auto-negotiate the panel's native mode; adjust scale if text is
# too small/large once logged in.
monitor=eDP-1,preferred,0x0,1
# Fallback: auto-configure any other monitor that gets plugged in (e.g. dock/HDMI)
monitor=,preferred,auto,1
